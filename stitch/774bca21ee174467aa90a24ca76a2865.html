<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Record Editor - Signal Desk Canary</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#dec29a",
                        "on-secondary-fixed-variant": "#38485d",
                        "tertiary-container": "#271901",
                        "surface-variant": "#e0e3e5",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#45464d",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#d8dadc",
                        "on-tertiary-container": "#98805d",
                        "on-primary-fixed-variant": "#3f465c",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#54647a",
                        "on-primary-fixed": "#131b2e",
                        "surface-tint": "#565e74",
                        "on-surface": "#191c1e",
                        "surface-container-highest": "#e0e3e5",
                        "on-tertiary-fixed": "#271901",
                        "secondary": "#505f76",
                        "inverse-primary": "#bec6e0",
                        "secondary-fixed": "#d3e4fe",
                        "surface-container-low": "#f2f4f6",
                        "primary-fixed-dim": "#bec6e0",
                        "inverse-on-surface": "#eff1f3",
                        "primary": "#000000",
                        "surface-container-high": "#e6e8ea",
                        "surface-bright": "#f7f9fb",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#2d3133",
                        "on-error": "#ffffff",
                        "primary-container": "#131b2e",
                        "on-background": "#191c1e",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface-container": "#eceef0",
                        "on-error-container": "#93000a",
                        "tertiary": "#000000",
                        "outline-variant": "#c6c6cd",
                        "on-primary-container": "#7c839b",
                        "tertiary-fixed": "#fcdeb5",
                        "on-primary": "#ffffff",
                        "outline": "#76777d",
                        "background": "#f7f9fb",
                        "primary-fixed": "#dae2fd",
                        "on-secondary-fixed": "#0b1c30",
                        "surface": "#f7f9fb",
                        "secondary-container": "#d0e1fb",
                        "on-tertiary-fixed-variant": "#574425",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "component-gap": "8px",
                        "stack-md": "12px",
                        "unit": "4px",
                        "stack-sm": "4px",
                        "container-padding": "24px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "label-md": ["JetBrains Mono"],
                        "headline-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["JetBrains Mono"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-md": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface font-body-md antialiased h-screen overflow-hidden flex">
<!-- SideNavBar -->
<aside class="bg-surface-container-low dark:bg-surface-container-lowest text-on-surface dark:text-on-surface-variant font-label-md text-label-md border-r border-outline-variant dark:border-outline flex flex-col fixed left-0 top-0 h-full z-40 docked h-full w-60 flat no shadows w-64 md:flex hidden flex-shrink-0">
<div class="p-container-padding flex-shrink-0 flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-sm">rocket_launch</span>
</div>
<div>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface text-sm">Signal Desk</h1>
<p class="text-[10px] text-on-surface-variant">V2.4.1 Canary</p>
</div>
</div>
<nav class="flex-grow px-3 py-2 space-y-1 overflow-y-auto">
<a class="text-on-surface-variant dark:text-surface-variant px-3 py-2 flex items-center gap-2 hover:bg-surface-variant dark:hover:bg-on-surface-variant transition-all rounded-lg" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
                Dashboard
            </a>
<a class="text-on-surface-variant dark:text-surface-variant px-3 py-2 flex items-center gap-2 hover:bg-surface-variant dark:hover:bg-on-surface-variant transition-all rounded-lg" href="#">
<span class="material-symbols-outlined" data-icon="dns">dns</span>
                Services
            </a>
<a class="text-on-surface-variant dark:text-surface-variant px-3 py-2 flex items-center gap-2 hover:bg-surface-variant dark:hover:bg-on-surface-variant transition-all rounded-lg" href="#">
<span class="material-symbols-outlined" data-icon="notification_important">notification_important</span>
                Alerts
            </a>
<a class="text-on-surface-variant dark:text-surface-variant px-3 py-2 flex items-center gap-2 hover:bg-surface-variant dark:hover:bg-on-surface-variant transition-all rounded-lg" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
                Settings
            </a>
<a class="text-on-surface-variant dark:text-surface-variant px-3 py-2 flex items-center gap-2 hover:bg-surface-variant dark:hover:bg-on-surface-variant transition-all rounded-lg" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
                Logs
            </a>
</nav>
<div class="p-4 flex-shrink-0 space-y-1">
<button class="w-full text-left text-on-surface-variant dark:text-surface-variant px-3 py-2 flex items-center gap-2 hover:bg-surface-variant dark:hover:bg-on-surface-variant transition-all rounded-lg">
<span class="material-symbols-outlined" data-icon="export_notes">export_notes</span>
                 Export Data
             </button>
<button class="w-full text-left text-on-surface-variant dark:text-surface-variant px-3 py-2 flex items-center gap-2 hover:bg-surface-variant dark:hover:bg-on-surface-variant transition-all rounded-lg">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
                 Help
             </button>
<div class="mt-4 pt-4 border-t border-outline-variant px-3">
<button class="text-error font-label-md text-[11px] uppercase tracking-wider font-semibold hover:opacity-80 transition-opacity flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">refresh</span>
                    Reset App State
                </button>
</div>
</div>
</aside>
<div class="flex-1 flex flex-col md:ml-64 relative min-w-0">
<!-- TopNavBar -->
<header class="bg-surface dark:bg-surface-dim font-headline-md text-headline-md border-b border-outline-variant dark:border-outline flex justify-between items-center w-full px-container-padding h-10 docked full-width top-0 flat no shadows sticky z-30 flex-shrink-0">
<div class="flex items-center gap-6">
<div class="font-headline-lg text-headline-lg font-black text-primary dark:text-primary-fixed md:hidden">
                    SD
                </div>
<nav class="hidden md:flex items-center h-full space-x-6">
<a class="text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors h-10 flex items-center px-2 text-sm" href="#">Operations</a>
<a class="text-primary dark:text-primary-fixed font-bold border-b-2 border-primary dark:border-primary-fixed pb-1 h-10 flex items-center px-2 text-sm" href="#">Editor</a>
<a class="text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors h-10 flex items-center px-2 text-sm" href="#">Insights</a>
</nav>
</div>
<div class="flex items-center gap-3">
<div class="relative hidden sm:block">
<span class="material-symbols-outlined absolute left-2 top-1/2 -translate-y-1/2 text-outline text-sm">search</span>
<input class="bg-surface-container-low border border-outline-variant rounded-DEFAULT pl-8 pr-3 py-1 text-sm focus:outline-none focus:border-primary w-48 transition-colors" placeholder="Search..." type="text"/>
</div>
<button class="text-on-surface hover:bg-surface-container-high p-1 rounded-DEFAULT transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="refresh">refresh</span>
</button>
<button class="text-on-surface hover:bg-surface-container-high p-1 rounded-DEFAULT transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="download">download</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto p-container-padding flex flex-col items-center justify-start py-8">
<div class="w-full max-w-2xl bg-surface-container-lowest border border-outline-variant rounded-lg p-6 shadow-sm">
<div class="mb-6 flex items-center justify-between">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Edit Record</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Update status record details.</p>
</div>
<div class="flex items-center gap-2 text-warning font-label-md text-label-md bg-warning/10 px-2 py-1 rounded">
<span class="material-symbols-outlined text-[14px]">warning</span>
<span>Unsaved changes</span>
</div>
</div>
<form class="space-y-6">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1" for="record-name">
                            Record Name
                            <span class="text-error">*</span>
</label>
<input class="w-full bg-surface border border-outline-variant rounded-DEFAULT px-3 py-2 font-body-sm text-body-sm focus:outline-none focus:border-primary transition-colors text-on-surface placeholder:text-outline" id="record-name" required="" type="text" value="API Gateway Latency Spike"/>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface" for="record-description">
                            Description
                        </label>
<textarea class="w-full bg-surface border border-outline-variant rounded-DEFAULT px-3 py-2 font-body-sm text-body-sm focus:outline-none focus:border-primary transition-colors text-on-surface resize-none" id="record-description" rows="4">Investigating elevated latency across main API gateway endpoints in US-East-1 region.</textarea>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface" for="initial-status">
                            Initial Status
                        </label>
<div class="relative">
<select class="w-full appearance-none bg-surface border border-outline-variant rounded-DEFAULT px-3 py-2 font-body-sm text-body-sm focus:outline-none focus:border-primary transition-colors text-on-surface" id="initial-status">
<option value="ok">OK</option>
<option selected="" value="warn">Warn</option>
<option value="down">Down</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">arrow_drop_down</span>
</div>
</div>
<div class="pt-6 border-t border-outline-variant flex items-center justify-end gap-3">
<button class="px-4 py-2 bg-surface-container-lowest border border-outline-variant text-on-surface font-label-md text-label-md rounded-DEFAULT hover:bg-surface-container-low transition-colors" type="button">
                            Cancel
                        </button>
<button class="px-4 py-2 bg-primary text-on-primary font-label-md text-label-md rounded-DEFAULT hover:opacity-90 transition-opacity" type="submit">
                            Save Record
                        </button>
</div>
</form>
</div>
</main>
</div>
</body></html>
